name: Windows local application

on:
  pull_request:
  push:
    branches: [main, "release/windows-v*"]
    tags: ["windows-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out the release tag for a release branch
        if: startsWith(github.ref, 'refs/heads/release/windows-v')
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          tag="${RELEASE_REF#release/}"
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          git checkout --detach "refs/tags/$tag"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/package-windows.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dm-command-table-windows-x64
          path: dist/*-windows-x64.zip*
          if-no-files-found: error

  smoke:
    runs-on: windows-latest
    needs: package
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dm-command-table-windows-x64
      - name: Set test source to the release tag
        if: startsWith(github.ref, 'refs/heads/release/windows-v')
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          tag="${RELEASE_REF#release/}"
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          git checkout --detach "refs/tags/$tag"
      - name: Run the extracted package using only its bundled Node
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter '*-windows-x64.zip' | Select-Object -First 1
          if (!$zip) { throw 'Missing Windows package' }
          $expected = (Get-Content "$($zip.FullName).sha256").Split(' ')[0]
          if ((Get-FileHash $zip.FullName).Hash -ne $expected) { throw 'Package checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'DMCT smoke'
          New-Item -ItemType Directory -Force $destination | Out-Null
          tar.exe -xf $zip.FullName -C $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = Join-Path $destination $zip.BaseName
          & (Join-Path $bundle 'node.exe') tests/windows-package-smoke.mjs $bundle
          exit $LASTEXITCODE

  publish:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/windows-v') || startsWith(github.ref, 'refs/heads/release/windows-v'))
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dm-command-table-windows-x64
      - name: Publish Windows ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="${RELEASE_REF#release/}"
          version="${RELEASE_TAG#windows-v}"
          archive="DM-Command-Table-${version}-windows-x64.zip"
          sha256sum -c "${archive}.sha256"
          cat > "$RUNNER_TEMP/windows-release.md" <<'NOTES'
          Portable release for Windows 10 and 11 (x64). The ZIP includes Node.js, SQLite, and the application dependencies.

          Extract the ZIP to a local NTFS folder, then double-click **Start.cmd**. Register with the token printed on the first launch. Campaigns and uploads are stored in `%LOCALAPPDATA%\DM Command Table`.

          To take a web campaign offline, choose **Export with images** on dm.lamagra.link, then **Campaign actions → Import** in the local app. The Bestiary offers online catalogue imports and offline import options.
          NOTES
          gh release create "$RELEASE_TAG" "$archive" "${archive}.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "DM Command Table Local ${version} for Windows" \
            --notes-file "$RUNNER_TEMP/windows-release.md"
